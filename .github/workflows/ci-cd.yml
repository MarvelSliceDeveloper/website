name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lms_test
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U lms_test"
          --health-interval=5s --health-timeout=3s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Sync DB and Seed
        run: pnpm prisma:reset
        env:
          DATABASE_URL: postgresql://lms_test:test@localhost:5432/lms_test
          JWT_SECRET: test-jwt-secret-must-be-32-chars-long!!
          CSRF_SECRET: test-csrf-secret-must-be-32-chars!!
          TOKEN_ENCRYPTION_KEY: test-32-byte-encryption-key-12345

      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Unit/Integration Tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://lms_test:test@localhost:5432/lms_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-must-be-32-chars-long!!
          CSRF_SECRET: test-csrf-secret-must-be-32-chars!!
          TOKEN_ENCRYPTION_KEY: test-32-byte-encryption-key-12345
          WEB_URL: http://localhost:3000
          API_URL: http://localhost:4000
          DISABLE_RATE_LIMIT: "true"

  build:
    name: Build & Push Images
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://lms.marvelslice.com
            NEXT_PUBLIC_APP_VERSION=1.0.1
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Landing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/landing/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-landing:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-landing:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Landing API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/landing/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-landing-api:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-landing-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/lms

            export REGISTRY=ghcr.io
            export IMAGE_NAME=${{ github.repository }}
            export TAG=latest

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull api web landing landing-api

            # Sync database schema (prisma db push — non-destructive)
            # Use the image's pinned Prisma 5.22.0 binary; bare `npx prisma`
            # fetches 8.0.0-rc.10 where `push` was removed.
            docker compose -f docker-compose.prod.yml run --rm --entrypoint "/app/node_modules/.bin/prisma" api db push --skip-generate

            # Start new containers (rolling update)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            # Verify health (nginx maps to 127.0.0.1:8080 via Apache/Webuzo on host; direct api check as fallback)
            sleep 10
            curl -f http://127.0.0.1:8080/health || curl -f http://localhost:8080/health || docker compose -f docker-compose.prod.yml exec -T api node -e "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" || exit 1
            echo "Deployment successful!"