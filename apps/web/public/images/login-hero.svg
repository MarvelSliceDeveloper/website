<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title">
  <title>Online learning illustration</title>
  <!-- FIX: white-dominant for blue left panel bg-primary (previous #1d4ed8 blended into blue and looked invisible) -->
  <!-- Soft glow bg -->
  <ellipse cx="350" cy="210" rx="260" ry="140" fill="white" opacity="0.07"/>
  <!-- Laptop base -->
  <rect x="170" y="285" width="360" height="14" rx="7" fill="white" opacity="0.95"/>
  <rect x="200" y="145" width="300" height="150" rx="16" fill="white" fill-opacity="0.14" stroke="white" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="218" y="163" width="264" height="114" rx="10" fill="white" opacity="0.10"/>
  <!-- Play button -->
  <circle cx="350" cy="220" r="26" fill="white" opacity="0.95"/>
  <path d="M342 206 L362 220 L342 234 Z" fill="#1d4ed8"/>
  <!-- Graduation cap -->
  <g opacity="0.98">
    <path d="M90 120 L150 95 L210 120 L150 145 Z" fill="white"/>
    <path d="M115 130 V158 C115 168 185 168 185 158 V130" fill="none" stroke="white" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round"/>
    <line x1="210" y1="120" x2="210" y2="150" stroke="white" stroke-opacity="0.75" stroke-width="3"/>
    <circle cx="210" cy="154" r="4" fill="white"/>
  </g>
  <!-- Open book -->
  <g opacity="0.98">
    <path d="M480 300 Q550 280 620 300 V335 Q550 315 480 335 Z" fill="white"/>
    <line x1="550" y1="300" x2="550" y2="335" stroke="#1d4ed8" stroke-opacity="0.3" stroke-width="2.5"/>
  </g>
  <!-- Chat bubble -->
  <g>
    <rect x="500" y="70" width="110" height="62" rx="14" fill="white" opacity="0.95"/>
    <path d="M525 132 L520 148 L542 132 Z" fill="white"/>
    <circle cx="528" cy="101" r="5" fill="#1d4ed8"/>
    <circle cx="555" cy="101" r="5" fill="#1d4ed8"/>
    <circle cx="582" cy="101" r="5" fill="#1d4ed8" opacity="0.35"/>
  </g>
  <!-- Student -->
  <g opacity="0.95">
    <circle cx="120" cy="255" r="22" fill="white" opacity="0.18"/>
    <circle cx="120" cy="248" r="9" fill="white"/>
    <path d="M105 270 Q120 260 135 270 L132 285 Q120 280 108 285 Z" fill="white"/>
  </g>
  <!-- Stars -->
  <g fill="white" opacity="0.55">
    <circle cx="80" cy="210" r="3"/>
    <circle cx="610" cy="200" r="2.5"/>
    <circle cx="60" cy="300" r="2"/>
  </g>
</svg>
