server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve landing-api at request time so nginx
    # doesn't crash on boot when the API container isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the SPA entry point — ensures fresh deploys load new assets
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Forward landing form submissions (/api/submit-*, /api/admin-reply) to
    # the landing API server (dev-server.js) running in the landing-api container
    location /api/ {
        set $target http://landing-api:3001;
        proxy_pass $target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 12m;
    }

    # Runtime config must never be cached — env changes apply on restart
    location = /config.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Cache static assets (exclude config.js above)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}