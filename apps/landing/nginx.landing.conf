server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward landing form submissions (/api/submit-*, /api/admin-reply) to
    # the landing API server (dev-server.js) running in the landing-api container
    location /api/ {
        proxy_pass http://landing-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime config must never be cached — env changes apply on restart
    location = /config.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Cache static assets (exclude config.js above)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}