# Layered on the vendored upstream compose:
#   docker compose -f vendor/docker/docker-compose.yml -f docker-compose.override.yml --env-file .env up -d
name: landing-supabase

services:
  # Compose CONCATENATES `ports` lists across files (it does not replace them),
  # which duplicated the base mappings and caused
  # "bind host port 127.0.0.1:54329: address already in use".
  # `!override` (Compose v2.24+) replaces the base list instead.
  # The landing app talks to Postgres via PostgREST, not the pooler, but keep it
  # available on localhost only.
  supavisor:
    ports: !override
      - "127.0.0.1:54329:5432"
      - "127.0.0.1:65439:6543"

  # The API gateway already binds to 127.0.0.1 because API_GW_HTTP_PORT
  # includes the host IP, so no port override is needed here.
