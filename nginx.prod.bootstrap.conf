# ═══════════════════════════════════════════════════════════════════════
# Bootstrap nginx config — HTTP ONLY.
# Used ONCE on a fresh VPS to obtain Let's Encrypt certificates.
# After certs are issued, replace this file with nginx.prod.conf and
# restart nginx. This file is NOT for ongoing use.
# ═══════════════════════════════════════════════════════════════════════
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    upstream api_backend { server api:4000; keepalive 32; }
    upstream web_backend { server web:3000; keepalive 32; }
    upstream landing_backend { server landing:80; keepalive 32; }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # ── Landing: www.marvelslice.com (HTTP) ──
    server {
        listen 80;
        listen [::]:80;
        server_name www.marvelslice.com;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location / { proxy_pass http://landing_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    }

    # ── LMS: lms.marvelslice.com (HTTP) ──
    server {
        listen 80;
        listen [::]:80;
        server_name lms.marvelslice.com;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location = /health { proxy_pass http://api_backend/health; access_log off; }

        location /api/ { limit_req zone=api_limit burst=200 nodelay; proxy_pass http://api_backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 50m; }

        location /uploads/ { proxy_pass http://api_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 50m; }

        location /socket.io/ { proxy_pass http://api_backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; }

        location / { proxy_pass http://web_backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 60s; }
    }
}