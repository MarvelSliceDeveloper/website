user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # Docker embedded DNS. Resolve upstreams at REQUEST time so nginx starts
    # even when api/web/landing containers are not yet up, and keeps working
    # across container restarts / IP changes. (Fixes "host not found in
    # upstream" that occurs when using static upstream blocks at boot.)
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # ── Landing: marvelslice.com (apex; TLS terminated by host Apache) ──
    server {
        listen 80;
        listen [::]:80;
        server_name marvelslice.com www.marvelslice.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Landing serverless API (dev-server.js on landing-api:3001)
        location /api/ {
            set $target http://landing-api:3001;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $target http://landing:80;
            proxy_pass $target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── LMS: lms.marvelslice.com (HTTP; TLS terminated by host Apache) ──
    server {
        listen 80;
        listen [::]:80;
        server_name lms.marvelslice.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check
        location = /health {
            set $target http://api:4000;
            proxy_pass $target;
            access_log off;
        }

        # API routes
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            set $target http://api:4000;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            client_max_body_size 50m;
        }

        # Auth endpoints - stricter rate limit
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            set $target http://api:4000;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded files (assignment submissions, etc.)
        location /uploads/ {
            set $target http://api:4000;
            proxy_pass $target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50m;
        }

        # Static images served by the API
        location /images/ {
            set $target http://api:4000;
            proxy_pass $target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.io (real-time notifications)
        location /socket.io/ {
            set $target http://api:4000;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Next.js web app
        location / {
            set $target http://web:3000;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ── pgAdmin: pgadmin.lms.marvelslice.com (HTTP; basic auth in front) ──
    server {
        listen 80;
        listen [::]:80;
        server_name pgadmin.lms.marvelslice.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        auth_basic "LMS Management — Restricted";
        auth_basic_user_file /etc/nginx/htpasswd;

        location / {
            set $target http://pgadmin:80;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
