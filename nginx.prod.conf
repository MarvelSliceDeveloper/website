user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Upstreams
    upstream api_backend {
        server api:4000;
        keepalive 32;
    }

    upstream web_backend {
        server web:3000;
        keepalive 32;
    }

    upstream landing_backend {
        server landing:80;
        keepalive 32;
    }

    upstream pgadmin_backend {
        server pgadmin:80;
        keepalive 32;
    }

    # Portainer is server-only (127.0.0.1:9000 on host, NOT via nginx). Access via SSH tunnel.

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # ── Landing: www.marvelslice.com ──
    server {
        listen 80;
        listen [::]:80;
        server_name www.marvelslice.com;

        # ACME challenge (Let's Encrypt) — certbot webroot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.marvelslice.com;

        ssl_certificate /etc/letsencrypt/live/www.marvelslice.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.marvelslice.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Landing static site
        location / {
            proxy_pass http://landing_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── LMS: lms.marvelslice.com ──
    server {
        listen 80;
        listen [::]:80;
        server_name lms.marvelslice.com;

        # ACME challenge (Let's Encrypt) — certbot webroot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name lms.marvelslice.com;

        # One cert covers both domains (issued as a single SAN cert for
        # www.marvelslice.com + lms.marvelslice.com), so both server blocks
        # reference the same files under live/www.marvelslice.com/.
        ssl_certificate /etc/letsencrypt/live/www.marvelslice.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.marvelslice.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check
        location = /health {
            proxy_pass http://api_backend/health;
            access_log off;
        }

        # API routes
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            client_max_body_size 50m;
        }

        # Auth endpoints - stricter rate limit
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded files (assignment submissions, etc.)
        location /uploads/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50m;
        }

        # Static images served by the API
        location /images/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.io (real-time notifications)
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Next.js web app
        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ── pgAdmin: pgadmin.lms.marvelslice.com ──
    # Reverse-proxied + HTTP basic auth in front of pgAdmin's own login.
    server {
        listen 80;
        listen [::]:80;
        server_name pgadmin.lms.marvelslice.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name pgadmin.lms.marvelslice.com;

        ssl_certificate /etc/letsencrypt/live/www.marvelslice.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.marvelslice.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        auth_basic "LMS Management — Restricted";
        auth_basic_user_file /etc/nginx/htpasswd;

        location / {
            proxy_pass http://pgadmin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

}