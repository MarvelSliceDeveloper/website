user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # Docker embedded DNS. Resolve upstreams at REQUEST time so nginx starts
    # even when api/web/landing containers are not yet up, and keeps working
    # across container restarts / IP changes. (Fixes "host not found in
    # upstream" that occurs when using static upstream blocks at boot.)
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ── Preserve X-Forwarded-Proto from host Apache (Webuzo) ──
    # Apache sets "https" for 443 vhosts and "http" for 80; nginx's $scheme is
    # always "http" on port 80/8081, so we must NOT overwrite the original with
    # $scheme. Map keeps the first value if already set.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # ── Security headers (defence-in-depth; also set by app) ──
    # Applied at http level so every server block inherits them; `always` ensures
    # they are sent on all status codes.
    # CSP removed for landing Supabase (was blocking localhost:54321) — re-add later with narrow allowlist if needed
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # ── Landing: marvelslice.com (apex; TLS terminated by host Apache) ──
    server {
        listen 80;
        listen [::]:80;
        server_name marvelslice.com www.marvelslice.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Landing serverless API (dev-server.js on landing-api:3001)
        location /api/ {
            set $target http://landing-api:3001;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location / {
            set $target http://landing:80;
            proxy_pass $target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }

    # ── LMS: lms.marvelslice.com (HTTP; TLS terminated by host Apache) ──
    # Listens on 8081 (port-based) and also on 80 via server_name so that
    # either ProxyPass to 8081 or to 80 with Host: lms.marvelslice.com routes
    # correctly — fixes double-proxy where Apache's RewriteRule may still hit :8080.
    server {
        listen 80;
        listen [::]:80;
        listen 8081;
        listen [::]:8081;
        server_name lms.marvelslice.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check
        location = /health {
            set $target http://api:4000;
            proxy_pass $target;
            access_log off;
        }

        # API routes
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            set $target http://api:4000;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host lms.marvelslice.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            client_max_body_size 50m;
        }

        # Auth endpoints - stricter rate limit
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            set $target http://api:4000;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Host lms.marvelslice.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Uploaded files (assignment submissions, etc.)
        location /uploads/ {
            set $target http://api:4000;
            proxy_pass $target;
            proxy_set_header Host lms.marvelslice.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            client_max_body_size 50m;
        }

        # Static images served by the API
        location /images/ {
            set $target http://api:4000;
            proxy_pass $target;
            proxy_set_header Host lms.marvelslice.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Socket.io (real-time notifications)
        location /socket.io/ {
            set $target http://api:4000;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host lms.marvelslice.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;
        }

        # Next.js web app
        location / {
            set $target http://web:3000;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host lms.marvelslice.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60s;
        }
    }

    # ── pgAdmin: pgadmin.lms.marvelslice.com (HTTP; basic auth in front) ──
    # Dedicated port 8082 so the host Apache can proxy the subdomain here
    # without depending on Host-header preservation.
    # Double proxy: Host Apache (Webuzo) -> nginx:8082 -> pgadmin:80, so trust 2 hops for X-Forwarded-*.
    server {
        listen 8082;
        listen [::]:8082;
        server_name pgadmin.lms.marvelslice.com;

        # pgAdmin serves its own CSP/frames — do not apply LMS security headers here (causes 401 + schema.svg errors)
        add_header Content-Security-Policy "" always;
        add_header X-Frame-Options "" always;
        add_header Referrer-Policy "" always;
        add_header Permissions-Policy "" always;
        add_header X-Content-Type-Options "" always;
        add_header Cross-Origin-Opener-Policy "" always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        auth_basic "LMS Management — Restricted";
        auth_basic_user_file /etc/nginx/htpasswd;

        location / {
            set $target http://pgadmin:80;
            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60s;
        }
    }
}

