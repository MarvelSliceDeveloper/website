# Production stack — build from repo root (monorepo pnpm workspace)
# Usage:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Secrets come from .env.production (copy .env.production.example → .env.production).

name: lms-prod

services:
  nginx:
    image: nginx:alpine
    container_name: lms-nginx
    ports:
      # HTTP-only: host Apache/Webuzo terminates SSL and proxies to Docker nginx on 8080.
      # No 443/certbot needed when Webuzo handles SSL (see docs/apache-proxy.md).
      # If you run without Webuzo (direct SSL), add "127.0.0.1:8443:443" and certbot volumes.
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - api
      - web
      - landing
    restart: unless-stopped
    networks: [lms-network]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-gh-username/lms}-api:${TAG:-latest}
    container_name: lms-api
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lms_prod}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lms_prod}
      - REDIS_URL=redis://redis:6379
      - SKIP_DB_PUSH=${SKIP_DB_PUSH:-1}
    volumes:
      - uploads_data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [lms-network]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://lms.marvelslice.com
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.0.1}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-gh-username/lms}-web:${TAG:-latest}
    container_name: lms-web
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://lms.marvelslice.com
    depends_on:
      - api
    restart: unless-stopped
    networks: [lms-network]

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-gh-username/lms}-landing:${TAG:-latest}
    container_name: lms-landing
    depends_on:
      - landing-api
    restart: unless-stopped
    networks: [lms-network]

  landing-api:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile.api
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-gh-username/lms}-landing-api:${TAG:-latest}
    container_name: lms-landing-api
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - DEV_API_PORT=3001
    restart: unless-stopped
    networks: [lms-network]

  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lms_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_prod}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [lms-network]

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [lms-network]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lms-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@marvelslice.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [lms-network]

  portainer:
    image: portainer/portainer-ce:latest
    container_name: lms-portainer
    command: -H unix:///var/run/docker.sock
    # Server-only: binds to 127.0.0.1 on the VPS. NOT exposed via nginx/public DNS.
    # Access via SSH tunnel: ssh -L 9000:localhost:9000 root@<VPS_IP> → http://localhost:9000
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks: [lms-network]

  # Certbot is only needed when Docker nginx terminates SSL directly (no Webuzo/Apache).
  # When Webuzo handles SSL, this service is unused — Apache proxies HTTPS to nginx:80 on 8080.
  # Uncomment if you run without Webuzo:
  # certbot:
  #   build:
  #     context: .
  #     dockerfile: deploy/certbot/Dockerfile
  #   image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-gh-username/lms}-certbot:${TAG:-latest}
  #   container_name: lms-certbot
  #   volumes:
  #     - certbot-webroot:/var/www/certbot
  #     - certbot-conf:/etc/letsencrypt
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   restart: unless-stopped
  #   networks: [lms-network]

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certbot-webroot:
  certbot-conf:
  pgadmin_data:
  portainer_data:

networks:
  lms-network:
    driver: bridge