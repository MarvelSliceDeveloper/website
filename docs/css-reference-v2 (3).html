<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Reference — Every Property, Explained & Shown</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#0b0d12; --panel:#11141c; --panel2:#161a24; --border:#232838;
    --text:#e4e7ee; --muted:#8891a7; --accent:#7dd3b0; --accent2:#f2b880;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); display:flex; min-height:100vh;}
  a{color:inherit;}

  #sidebar{
    width:250px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
    height:100vh; position:sticky; top:0; overflow-y:auto; padding:20px 0;
  }
  #sidebar h1{font-size:14px; padding:0 20px 14px; margin:0; color:var(--text); font-weight:600; letter-spacing:.02em;}
  #search{
    display:block; width:calc(100% - 32px); margin:0 16px 16px; padding:8px 10px;
    background:var(--panel2); border:1px solid var(--border); border-radius:6px; color:var(--text);
    font-size:13px; font-family:var(--sans);
  }
  #search:focus{outline:none; border-color:var(--accent);}
  .nav-cat{
    display:block; padding:7px 20px; font-size:12.5px; color:var(--muted); text-decoration:none;
    border-left:2px solid transparent; cursor:pointer; transition:.15s;
  }
  .nav-cat:hover{color:var(--text); background:var(--panel2);}
  .nav-cat.active{color:var(--accent); border-left-color:var(--accent); background:var(--panel2);}

  #main{flex:1; padding:40px 48px; max-width:980px;}
  #main > p.intro{color:var(--muted); font-size:14px; margin-top:0; margin-bottom:36px; max-width:640px; line-height:1.6;}

  section.category{margin-bottom:56px; scroll-margin-top:24px;}
  section.category > h2{
    font-size:20px; margin:0 0 4px; padding-bottom:10px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px;
  }
  section.category > h2 .tag{
    font-size:11px; font-weight:400; color:var(--muted); background:var(--panel2);
    padding:2px 8px; border-radius:10px; border:1px solid var(--border);
  }
  section.category > p.desc{color:var(--muted); font-size:13.5px; margin:10px 0 20px; line-height:1.6;}

  .prop{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; margin-bottom:12px;
  }
  .prop-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .prop-name{font-family:var(--mono); font-size:14.5px; color:var(--accent); font-weight:600;}
  .prop-syntax{font-family:var(--mono); font-size:11.5px; color:var(--muted);}
  .prop-desc{font-size:13.5px; color:#b7bdcc; margin:8px 0 12px; line-height:1.6;}

  .values{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .val{
    font-family:var(--mono); font-size:11.5px; background:var(--panel2); color:var(--accent2);
    border:1px solid var(--border); border-radius:5px; padding:3px 8px;
  }

  /* visual demo styles */
  .demo{ background:var(--panel2); border:1px dashed var(--border); border-radius:8px; padding:14px; }
  .demo-row{display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end;}
  .demo-item{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .demo-label{font-family:var(--mono); font-size:10.5px; color:var(--muted); text-align:center; max-width:110px;}
  .demo-box{width:64px; height:64px; border-radius:6px; background:var(--accent); flex-shrink:0;}
  .demo-text-sample{font-size:14px; color:var(--text); background:var(--panel); padding:8px 12px; border-radius:6px; border:1px solid var(--border); min-width:110px; text-align:left;}
  .demo-flexbox{width:190px; height:70px; background:var(--panel); border:1px solid var(--border); border-radius:6px; display:flex; padding:6px; gap:6px;}
  .demo-flexbox .dot{width:20px; height:20px; border-radius:5px; background:var(--accent2); flex-shrink:0;}
  .demo-gridbox{width:150px; height:100px; background:var(--panel); border:1px solid var(--border); border-radius:6px; display:grid; padding:6px; gap:5px;}
  .demo-gridbox .cell{background:var(--accent); border-radius:4px;}
  .demo-para{font-size:12.5px; color:var(--text); background:var(--panel); padding:10px; border-radius:6px; border:1px solid var(--border); width:190px;}
  .demo-blend{position:relative; width:90px; height:70px;}
  .demo-blend .c1, .demo-blend .c2{position:absolute; width:50px; height:50px; border-radius:50%;}
  .demo-blend .c1{left:0; top:10px; background:var(--accent);}
  .demo-blend .c2{left:28px; top:0; background:var(--accent2);}
  .demo-cursor{width:100px; height:56px; background:var(--panel); border:1px solid var(--border); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted);}

  /* Tailwind demo scaffolding — deliberately unstyled for size/color so Tailwind utility classes control those */
  .tw-box{flex-shrink:0;}
  .tw-flexbox{width:190px; min-height:70px; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:6px;}
  .tw-flexbox .dot{width:20px; height:20px; border-radius:5px; background:var(--accent2); flex-shrink:0;}
  .tw-gridbox{width:150px; height:100px; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:6px;}
  .tw-gridbox .cell{background:var(--accent); border-radius:4px;}
  .tw-text{font-size:14px; color:var(--text); background:var(--panel); padding:8px 12px; border-radius:6px; border:1px solid var(--border); min-width:110px; text-align:left;}
  .tw-para{font-size:12.5px; color:var(--text); background:var(--panel); padding:10px; border-radius:6px; border:1px solid var(--border); width:190px;}
  .tw-note{font-size:12.5px; color:var(--muted); margin:0; line-height:1.6;}
  .tw-note code{color:var(--accent2); font-family:var(--mono); font-size:11.5px;}

  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#2a3040; border-radius:4px;}

  @media (max-width: 800px){
    body{flex-direction:column;}
    #sidebar{width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--border);}
    #main{padding:24px;}
  }
</style>
</head>
<body>

<nav id="sidebar">
  <h1>CSS Reference</h1>
  <input type="text" id="search" placeholder="Search a property..." />
  <div id="nav-list"></div>
</nav>

<main id="main">
  <p class="intro">Every core CSS property — plus Tailwind CSS's utility classes — grouped by category, with a live rendered preview of what each value actually looks like. Tailwind demos run on the real Tailwind Play CDN, not simulated styles.</p>
  <div id="content"></div>
</main>

<script>
function box(label, style){ return `<div class="demo-item"><div class="demo-box" style="${style}"></div><span class="demo-label">${label}</span></div>`; }
function text(label, style, sample){ return `<div class="demo-item"><div class="demo-text-sample" style="${style}">${sample||'Aa Bb Cc'}</div><span class="demo-label">${label}</span></div>`; }
function para(label, style, sample){ return `<div class="demo-item"><div class="demo-para" style="${style}">${sample}</div><span class="demo-label">${label}</span></div>`; }
function flexDemo(label, containerStyle){ return `<div class="demo-item"><div class="demo-flexbox" style="${containerStyle}"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span class="demo-label">${label}</span></div>`; }
function gridDemo(label, containerStyle, cells){ return `<div class="demo-item"><div class="demo-gridbox" style="${containerStyle}">${Array(cells||4).fill('<div class="cell"></div>').join('')}</div><span class="demo-label">${label}</span></div>`; }
function blendDemo(label, blendStyle){ return `<div class="demo-item"><div class="demo-blend"><div class="c1"></div><div class="c2" style="${blendStyle}"></div></div><span class="demo-label">${label}</span></div>`; }
function cursorDemo(label, style){ return `<div class="demo-item"><div class="demo-cursor" style="${style}">hover me</div><span class="demo-label">${label}</span></div>`; }
function wrap(rowHtml){ return `<div class="demo"><div class="demo-row">${rowHtml}</div></div>`; }

// --- Tailwind demo helpers: size/color come entirely from the Tailwind class string, not local CSS ---
function twBox(label, cls){ return `<div class="demo-item"><div class="tw-box ${cls}"></div><span class="demo-label">${label}</span></div>`; }
function twText(label, cls, sample){ return `<div class="demo-item"><div class="tw-text ${cls}">${sample||'Aa Bb Cc'}</div><span class="demo-label">${label}</span></div>`; }
function twPara(label, cls, sample){ return `<div class="demo-item"><div class="tw-para ${cls}">${sample}</div><span class="demo-label">${label}</span></div>`; }
function twFlex(label, containerCls, dots){ return `<div class="demo-item"><div class="tw-flexbox flex ${containerCls}">${Array(dots||3).fill('<div class="dot"></div>').join('')}</div><span class="demo-label">${label}</span></div>`; }
function twGrid(label, containerCls, cells){ return `<div class="demo-item"><div class="tw-gridbox grid ${containerCls}">${Array(cells||4).fill('<div class="cell"></div>').join('')}</div><span class="demo-label">${label}</span></div>`; }
function twNote(html){ return `<div class="demo"><p class="tw-note">${html}</p></div>`; }

const DATA = [
  {
    id: "display-position",
    title: "Layout: Display & Position",
    desc: "How an element participates in the page layout and where it sits.",
    props: [
      { name: "display", syntax: "display: value;", desc: "Sets how an element is treated in layout — as a box, inline text, flex container, etc.",
        values: ["block","inline","inline-block","flex","grid","none","table"],
        demo: wrap(
          `<div class="demo-item"><div style="width:130px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px;">
            <span style="display:block;background:var(--accent);color:#0b0d12;padding:2px 4px;border-radius:3px;">block</span>
            <span style="display:block;background:var(--accent2);color:#0b0d12;padding:2px 4px;border-radius:3px;margin-top:2px;">block</span>
          </div><span class="demo-label">display: block (stacks, full width)</span></div>` +
          `<div class="demo-item"><div style="width:130px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px;">
            <span style="display:inline;background:var(--accent);color:#0b0d12;padding:2px 4px;border-radius:3px;">inline</span>
            <span style="display:inline;background:var(--accent2);color:#0b0d12;padding:2px 4px;border-radius:3px;">inline</span>
          </div><span class="demo-label">display: inline (flows in line)</span></div>` +
          `<div class="demo-item"><div style="width:130px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px;display:flex;gap:4px;font-size:11px;">
            <span style="background:var(--accent);color:#0b0d12;padding:2px 4px;border-radius:3px;">flex</span>
            <span style="background:var(--accent2);color:#0b0d12;padding:2px 4px;border-radius:3px;">flex</span>
          </div><span class="demo-label">display: flex (row of items)</span></div>`
        ) },
      { name: "position", syntax: "position: value;", desc: "Choosing relative/absolute lets you offset an element with top/right/bottom/left.",
        values: ["static","relative","absolute","fixed","sticky"],
        demo: wrap(
          `<div class="demo-item"><div style="position:relative;width:100px;height:70px;background:var(--panel);border:1px solid var(--border);border-radius:6px;">
            <div style="position:absolute;top:8px;left:8px;width:26px;height:26px;background:var(--accent);border-radius:4px;"></div>
            <div style="position:absolute;bottom:8px;right:8px;width:26px;height:26px;background:var(--accent2);border-radius:4px;"></div>
          </div><span class="demo-label">absolute (positioned freely inside a relative parent)</span></div>`
        ) },
      { name: "float", syntax: "float: left;", desc: "Pulls an element to one side, letting inline content wrap around it.",
        values: ["left","right","none"],
        demo: wrap(`<div class="demo-item"><div style="width:170px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px;line-height:1.5;">
          <span style="float:left;width:30px;height:30px;background:var(--accent);border-radius:4px;margin-right:6px;"></span>
          Text wraps around the floated box on its left side, flowing naturally.
        </div><span class="demo-label">float: left</span></div>`) },
      { name: "overflow", syntax: "overflow: value;", desc: "What happens when content is bigger than its box.",
        values: ["visible","hidden","scroll","auto","clip"],
        demo: wrap(
          box("hidden (clipped)", "background:var(--panel);border:1px solid var(--border);overflow:hidden;position:relative;") +
          `<div class="demo-item"><div style="width:64px;height:64px;background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:auto;font-size:10px;color:var(--muted);padding:4px;">This text is longer than the box so it scrolls inside it.</div><span class="demo-label">auto (scrolls)</span></div>`
        ) },
      { name: "visibility", syntax: "visibility: value;", desc: "Hides an element visually but (unlike display:none) keeps its layout space.",
        values: ["visible","hidden","collapse"],
        demo: wrap(
          `<div class="demo-item"><div style="display:flex;gap:6px;"><div class="demo-box" style="width:26px;height:26px;"></div><div class="demo-box" style="width:26px;height:26px;visibility:hidden;"></div><div class="demo-box" style="width:26px;height:26px;"></div></div><span class="demo-label">middle box: visibility:hidden — invisible, space kept</span></div>`
        ) },
    ]
  },
  {
    id: "box-model",
    title: "Box Model: Size & Spacing",
    desc: "Dimensions and the space around/inside an element.",
    props: [
      { name: "margin", syntax: "margin: 10px 20px;", desc: "Space outside the element's border, pushing other elements away.",
        values: ["0","8px","16px 32px","auto"],
        demo: wrap(
          `<div class="demo-item"><div style="background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px;"><div class="demo-box" style="width:36px;height:36px;margin:0;"></div></div><span class="demo-label">margin: 0</span></div>` +
          `<div class="demo-item"><div style="background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px;"><div class="demo-box" style="width:36px;height:36px;margin:16px;"></div></div><span class="demo-label">margin: 16px</span></div>`
        ) },
      { name: "padding", syntax: "padding: 10px 20px;", desc: "Space inside the element's border, between the border and the content.",
        values: ["0","8px","16px 24px"],
        demo: wrap(
          `<div class="demo-item"><div style="background:var(--accent);border-radius:6px;padding:2px;display:inline-block;"><div style="background:var(--panel);color:var(--text);font-size:10px;padding:2px;">text</div></div><span class="demo-label">padding: 2px</span></div>` +
          `<div class="demo-item"><div style="background:var(--accent);border-radius:6px;padding:16px;display:inline-block;"><div style="background:var(--panel);color:var(--text);font-size:10px;padding:2px;">text</div></div><span class="demo-label">padding: 16px</span></div>`
        ) },
      { name: "width / height", syntax: "width: 200px;", desc: "Sets the box's size.",
        values: ["auto","fixed length","percentage","min/max-content"],
        demo: wrap( box("40px", "width:40px;height:40px;") + box("64px", "width:64px;height:64px;") + box("wide: 120px x 40px", "width:120px;height:40px;") ) },
      { name: "aspect-ratio", syntax: "aspect-ratio: 16 / 9;", desc: "Preferred width-to-height ratio for a box.",
        values: ["1 / 1","16 / 9","4 / 3"],
        demo: wrap( box("1 / 1", "width:60px;aspect-ratio:1/1;") + box("16 / 9", "width:96px;aspect-ratio:16/9;") + box("4 / 3", "width:80px;aspect-ratio:4/3;") ) },
    ]
  },
  {
    id: "borders",
    title: "Border & Outline",
    desc: "Lines drawn around the edge of an element's box.",
    props: [
      { name: "border-style", syntax: "border-style: dashed;", desc: "The line pattern of the border.",
        values: ["solid","dashed","dotted","double","groove","ridge"],
        demo: wrap(
          ["solid","dashed","dotted","double","groove","ridge"].map(s=>box(s, `background:transparent;border:4px ${s} var(--accent2);`)).join('')
        ) },
      { name: "border-radius", syntax: "border-radius: 8px;", desc: "Rounds the corners of the box.",
        values: ["0","8px","16px","50% (circle)"],
        demo: wrap( box("0", "border-radius:0;") + box("8px", "border-radius:8px;") + box("20px", "border-radius:20px;") + box("50% (circle)", "border-radius:50%;") ) },
      { name: "border-width", syntax: "border-width: 4px;", desc: "Thickness of the border line.",
        values: ["1px","2px","6px"],
        demo: wrap( box("1px", "background:transparent;border:1px solid var(--accent2);") + box("3px", "background:transparent;border:3px solid var(--accent2);") + box("6px", "background:transparent;border:6px solid var(--accent2);") ) },
      { name: "outline", syntax: "outline: 2px solid blue;", desc: "A line outside the border that doesn't affect layout — common for focus states.",
        values: ["2px solid + offset"],
        demo: wrap( box("outline, offset 3px", "border-radius:6px;outline:3px solid var(--accent2);outline-offset:3px;") ) },
    ]
  },
  {
    id: "background",
    title: "Background",
    desc: "Fills behind an element's content and padding.",
    props: [
      { name: "background-color", syntax: "background-color: #fafafa;", desc: "Solid fill color behind the element.",
        values: ["hex","rgb()","hsl()","transparent"],
        demo: wrap( box("teal", "background:#7dd3b0;") + box("amber", "background:#f2b880;") + box("dark", "background:#232838;") + box("transparent", "background:transparent;border:1px dashed var(--muted);") ) },
      { name: "background-image (gradient)", syntax: "background-image: linear-gradient(...);", desc: "A gradient or image drawn behind content.",
        values: ["linear-gradient","radial-gradient","conic-gradient"],
        demo: wrap(
          box("linear-gradient", "background:linear-gradient(135deg,#7dd3b0,#f2b880);") +
          box("radial-gradient", "background:radial-gradient(circle,#f2b880,#11141c);") +
          box("conic-gradient", "background:conic-gradient(#7dd3b0,#f2b880,#7dd3b0);")
        ) },
      { name: "background-repeat / size", syntax: "background-repeat: repeat;", desc: "How a background image tiles and scales within the box.",
        values: ["repeat","no-repeat","cover"],
        demo: wrap(
          box("repeat (tiled pattern)", "background-image:repeating-linear-gradient(45deg,#7dd3b0 0 6px,#11141c 6px 12px);") +
          box("no-repeat (single, top-left)", "background:linear-gradient(135deg,#f2b880,#7dd3b0) no-repeat top left / 30px 30px, var(--panel);")
        ) },
    ]
  },
  {
    id: "typography",
    title: "Typography",
    desc: "Controls how text looks and flows.",
    props: [
      { name: "font-weight", syntax: "font-weight: 600;", desc: "Boldness of the text.",
        values: ["300","400","600","700","900"],
        demo: wrap( ["300","400","600","700","900"].map(w=>text(w, `font-weight:${w};`)).join('') ) },
      { name: "font-style", syntax: "font-style: italic;", desc: "Slants the text.",
        values: ["normal","italic"],
        demo: wrap( text("normal","font-style:normal;") + text("italic","font-style:italic;") ) },
      { name: "text-align", syntax: "text-align: center;", desc: "Horizontal alignment of text inside its container.",
        values: ["left","center","right","justify"],
        demo: wrap(
          para("left","text-align:left;","Aligned to the left edge of the box.") +
          para("center","text-align:center;","Centered in the box.") +
          para("right","text-align:right;","Aligned to the right edge.")
        ) },
      { name: "text-decoration", syntax: "text-decoration: underline;", desc: "Lines drawn on text.",
        values: ["none","underline","line-through","overline","wavy underline"],
        demo: wrap(
          text("underline","text-decoration:underline;") +
          text("line-through","text-decoration:line-through;") +
          text("overline","text-decoration:overline;") +
          text("wavy","text-decoration:underline wavy var(--accent2);")
        ) },
      { name: "text-transform", syntax: "text-transform: uppercase;", desc: "Changes letter casing for display, without touching the underlying text.",
        values: ["none","uppercase","lowercase","capitalize"],
        demo: wrap(
          text("uppercase","text-transform:uppercase;","hello world") +
          text("lowercase","text-transform:lowercase;","HELLO WORLD") +
          text("capitalize","text-transform:capitalize;","hello world")
        ) },
      { name: "letter-spacing", syntax: "letter-spacing: 0.1em;", desc: "Extra space between letters.",
        values: ["normal","0.05em","0.2em","-0.05em"],
        demo: wrap( text("normal","letter-spacing:normal;") + text("0.1em","letter-spacing:0.1em;") + text("0.3em","letter-spacing:0.3em;") ) },
      { name: "line-height", syntax: "line-height: 1.5;", desc: "Vertical space each line of text occupies.",
        values: ["1","1.5","2"],
        demo: wrap(
          para("line-height: 1","line-height:1;","This paragraph has tightly packed lines of text stacked closely.") +
          para("line-height: 1.8","line-height:1.8;","This paragraph has airy, spaced-out lines that are easier to read.")
        ) },
      { name: "text-overflow", syntax: "text-overflow: ellipsis;", desc: "How clipped text is signaled (needs overflow:hidden + white-space:nowrap).",
        values: ["clip","ellipsis"],
        demo: wrap(
          `<div class="demo-item"><div style="width:90px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px;font-size:11px;">This text is too long to fit</div><span class="demo-label">ellipsis</span></div>`+
          `<div class="demo-item"><div style="width:90px;overflow:hidden;white-space:nowrap;text-overflow:clip;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px;font-size:11px;">This text is too long to fit</div><span class="demo-label">clip</span></div>`
        ) },
    ]
  },
  {
    id: "color-effects",
    title: "Color, Opacity & Effects",
    desc: "Visual finishing touches — transparency, shadows, blur, blending.",
    props: [
      { name: "opacity", syntax: "opacity: 0.5;", desc: "Overall transparency of the element and its children.",
        values: ["1","0.75","0.5","0.25"],

const content = document.getElementById('content');
const navList = document.getElementById('nav-list');

DATA.forEach(cat => {
  const a = document.createElement('a');
  a.href = '#' + cat.id;
  a.className = 'nav-cat';
  a.textContent = cat.title;
  a.dataset.target = cat.id;
  navList.appendChild(a);

  const section = document.createElement('section');
  section.className = 'category';
  section.id = cat.id;
  section.innerHTML = `<h2>${cat.title} <span class="tag">${cat.props.length} properties</span></h2><p class="desc">${cat.desc}</p>`;

  cat.props.forEach(p => {
    const div = document.createElement('div');
    div.className = 'prop';
    div.dataset.search = (p.name + ' ' + p.desc).toLowerCase();
    div.innerHTML = `
      <div class="prop-head">
        <span class="prop-name">${p.name}</span>
        <span class="prop-syntax">${p.syntax}</span>
      </div>
      <p class="prop-desc">${p.desc}</p>
      <div class="values">${p.values.map(v => `<span class="val">${v}</span>`).join('')}</div>
      ${p.demo || ''}
    `;
    section.appendChild(div);
  });

  content.appendChild(section);
});

const navLinks = [...document.querySelectorAll('.nav-cat')];
const sections = [...document.querySelectorAll('section.category')];
const io = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      navLinks.forEach(l => l.classList.remove('active'));
      const link = navLinks.find(l => l.dataset.target === entry.target.id);
      if (link) link.classList.add('active');
    }
  });
}, { rootMargin: '-10% 0px -80% 0px' });
sections.forEach(s => io.observe(s));

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  document.querySelectorAll('.prop').forEach(el => {
    el.classList.toggle('hidden', q.length > 0 && !el.dataset.search.includes(q));
  });
  document.querySelectorAll('section.category').forEach(sec => {
    const anyVisible = [...sec.querySelectorAll('.prop')].some(el => !el.classList.contains('hidden'));
    sec.classList.toggle('hidden', q.length > 0 && !anyVisible);
  });
});
